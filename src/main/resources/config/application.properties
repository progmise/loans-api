spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/LOAN_API}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.show-sql=true
spring.jpa.hibernate.ddl-auto=none
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.properties.hibernate.globally_quoted_identifiers=true

spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:/schema.sql
spring.sql.init.continue-on-error=true

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.ssl.enabled=${REDIS_SSL:false}
spring.data.redis.timeout=${REDIS_TIMEOUT:5000}

server.port=${PORT:8080}
server.forward-headers-strategy=framework
server.shutdown=graceful

springdoc.swagger-ui.path=/swagger-ui.html

sentry.dsn=${SENTRY_DSN:}
sentry.enabled=${SENTRY_ENABLED:false}

cache.users.name=${CACHE_USERS_NAME:users}
cache.users.time-to-live.seconds=${CACHE_USERS_TTL:300}
